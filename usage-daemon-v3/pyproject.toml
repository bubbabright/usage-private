[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usage-daemon-v3"
version = "0.1.0"
description = "Python rewrite of usage-daemon: poll LLM/API provider quotas and expose them over HTTP (zero JS)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.scripts]
usage-daemon-v3 = "usage_daemon.__main__:main"

[tool.setuptools.packages.find]
include = ["usage_daemon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]