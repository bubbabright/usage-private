<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#87ceeb"/>
      <stop offset="50%" stop-color="#40e0d0"/>
      <stop offset="100%" stop-color="#ffa500"/>
    </radialGradient>
  </defs>

  <g>
    <!-- Bobble animation on the whole group -->
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="-2 24 28; 2 24 28; -2 24 28"
      dur="2s"
      repeatCount="indefinite"
      additive="sum"/>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 0 -4; 0 0"
      dur="2s"
      repeatCount="indefinite"
      additive="sum"/>

    <!-- Circle background -->
    <circle cx="24" cy="28" r="20" fill="url(#bg)"/>

    <!-- Fish body -->
    <ellipse cx="24" cy="29" rx="9" ry="6" fill="#ff6b35"/>
    <!-- Fish tail -->
    <polygon points="33,29 39,24 39,34" fill="#ff8c42"/>
    <!-- Fish belly -->
    <ellipse cx="22" cy="30" rx="5" ry="3" fill="#ffb347" opacity="0.6"/>
    <!-- Fish eye -->
    <circle cx="17" cy="27" r="2" fill="white"/>
    <circle cx="17" cy="27" r="1" fill="#1a1a2e"/>
    <!-- Fish stripes -->
    <line x1="21" y1="24" x2="21" y2="34" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <line x1="25" y1="24" x2="25" y2="34" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

    <!-- Hat brim -->
    <ellipse cx="20" cy="13" rx="8" ry="2.5" fill="#1a1a2e"/>
    <!-- Hat body -->
    <rect x="13.5" y="5" width="13" height="9" rx="1.5" fill="#2c2c54"/>
    <!-- Hat band -->
    <rect x="13.5" y="11" width="13" height="2" fill="#ffa500"/>
    <!-- Hat top rounded -->
    <ellipse cx="20" cy="5.5" rx="6.5" ry="1.5" fill="#2c2c54"/>
  </g>
</svg>
