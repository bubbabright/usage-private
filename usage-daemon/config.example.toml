# usage-daemon config — copy to ~/.config/usage-daemon/config.toml
# The daemon binds 0.0.0.0 (LAN-reachable). No per-request auth — keep it
# behind the LAN/Tailscale boundary, never a public WAN port.

port = 8787

[providers.ollama]
enabled = true
interval_seconds = 300
# Ollama's website auths on the browser SESSION COOKIE, not the API key.
# Copy it from DevTools -> Application -> Cookies -> ollama.com (the whole
# "name=value; name2=value2" cookie header), into this file:
cookie_file = "~/.config/usage-daemon/ollama.cookie"
# ...or inline instead of a file:
# cookie = "session=...; other=..."

[providers.claude]
enabled = true
interval_seconds = 300
# Reads ~/.claude/.credentials.json ($CLAUDE_CONFIG_DIR override respected)
# directly -- the same OAuth token the Claude Code CLI uses. Daemon never
# writes this file. No cookie needed.
# credentials_path = "~/.claude/.credentials.json"  # optional override

[providers.grok]
enabled = true
interval_seconds = 300
# Reads ~/.grok/auth.json (the OAuth token the `grok` CLI manages, from
# `grok login`) directly. Daemon never writes this file. Monthly comes from
# cli-chat-proxy.grok.com/v1/billing; weekly SuperGrok % is auto-fetched from
# grok.com's gRPC-web GetGrokCreditsConfig (best-effort). No cookie needed.
# auth_path = "~/.grok/auth.json"  # optional override

[providers.mistral]
enabled = false
interval_seconds = 300
# Vibe + API free-tier meters (admin.mistral.ai tRPC billing.budget) use the
# browser SESSION COOKIE, not an inference API key — same model as ollama.
# Copy from DevTools -> Application -> Cookies -> admin.mistral.ai:
cookie_file = "~/.config/usage-daemon/mistral.cookie"
# ...or inline:
# cookie = "..."
# Optional Admin-role API key for monthly_spend (org-wide $ vs cap — separate
# from the cookie-based per-account api_monthly above). Member/Billing keys
# 403. Daemon never writes this file; never calls POST /spend-limit.
# admin_key_file = "~/.config/usage-daemon/mistral.admin.key"
# admin_key = "..."

[providers.opencode-go]
enabled = false
interval_seconds = 300
# OpenCode Go's workspace "Go" page auths on the browser SESSION COOKIE.
# Copy from DevTools -> Application -> Cookies -> opencode.ai (whole
# "name=value; ..." header):
cookie_file = "~/.config/usage-daemon/opencode-go.cookie"
# ...or inline:
# cookie = "auth=Fe26.2**...; ..."
# Optional: pin the workspace id (wrk_...) shown in the dashboard URL. If
# omitted, the daemon auto-discovers it from an authed page on first fetch.
# workspace_id = "wrk_..."
# Optional: the local opencode CLI's own SQLite db has real-time per-request
# cost — far more precise than the scraped page (which opencode.ai only
# batch-updates). When readable, its $ sums replace the scraped 5h/weekly/
# monthly pct (using the Go plan's published $12/$30/$60 caps) and populate a
# per-model cost breakdown. Only useful if the daemon runs on the same host
# as the opencode CLI. Defaults to ~/.local/share/opencode/opencode.db.
# db_path = "~/.local/share/opencode/opencode.db"

# --- Firefox as a cookie source (cookie-auth providers only) ---
#
# Any provider with `auth.kind = 'cookie'` (ollama, mistral, opencode-go) can
# read its session cookie straight out of Firefox instead of using a cookie
# hand-pasted into the web UI Settings gear:
#
#   cookie_from_firefox = "ollama.com"
#
# The value is the registrable domain; every cookie stored for that domain and
# its subdomains is assembled into one Cookie header — the same thing the
# browser would send, and the same shape as the pasted cookies it replaces
# (mistral's, for instance, spans .mistral.ai + console. + admin.).
#
# Why: session cookies expire, and every expiry used to mean opening devtools
# and pasting a fresh one. Firefox already holds a live copy, so re-logging in
# the browser becomes the entire fix.
#
# ON REQUEST ONLY. Setting this does NOT make the daemon read Firefox on a
# timer — it only enables the "refresh cookie from Firefox" action
# (POST /usage/<provider>/cookie/from-firefox, a button in the web UI). The
# daemon keeps using the stored cookie until it expires; then you approve one
# read. A background poller reaching into the browser profile every few
# minutes would be a standing cookie-harvesting capability for no benefit —
# the answer only changes when a session expires and you log back in.
#
# Notes:
#   - Firefox stores cookie values in plaintext SQLite — no keyring decrypt.
#   - The database is copied before reading; the profile is never written to,
#     and Firefox can stay open.
#   - Profile is auto-detected (prefers default-release, else most recently
#     used). Override the search root with USAGE_FIREFOX_DIR.
#   - A refresh that finds nothing usable fails loudly and leaves the stored
#     cookie intact rather than overwriting it with an empty one.

[providers.openrouter]
enabled = false
interval_seconds = 300
# A normal OpenRouter API key (Bearer). Get it at openrouter.ai/settings/keys.
# GET /api/v1/key gives the per-key credit cap + spend; GET /api/v1/credits
# gives the account prepaid balance (that one needs a provisioning key and is
# skipped otherwise — the key window still works). Daemon never writes this file.
api_key_file = "~/.config/usage-daemon/openrouter.key"
# ...or inline:
# api_key = "sk-or-v1-..."

[providers.cloudflare]
enabled = false
interval_seconds = 300
# Cloudflare Workers AI: daily 10,000-neuron free quota, reset 00:00 UTC, with
# uncapped overage on Workers Paid (pct can exceed 100). Source is the GraphQL
# Analytics API (aiInferenceAdaptiveGroups, sum.totalNeurons per day).
# api_token: a Cloudflare API token as Bearer. The token `wrangler login` mints
# (account:read) is sufficient — no dedicated Analytics scope needed. Daemon
# never writes this file.
api_token_file = "~/.config/usage-daemon/cloudflare.token"
# ...or inline:
# api_token = "..."
# Required: the account tag (32-hex) — `wrangler whoami` shows it as Account ID.
account_id = "REPLACE_WITH_ACCOUNT_ID"

[providers.deepgram]
enabled = false
interval_seconds = 300
# Deepgram pay-as-you-go: reads the prepaid dollar balance (not usage counts).
# API key (Token auth) needs the `usage:read` scope for the project. Get it at
# console.deepgram.com. Daemon never writes this file.
api_key_file = "~/.config/usage-daemon/deepgram.key"
# ...or inline:
# api_key = "..."
# Optional: pin a project UUID. If omitted, the daemon lists every project the
# key can see and sums their balances.
# project_id = "your-project-uuid"
# Optional: a starting-credit figure ($) so the balance renders as a used-%
# meter instead of a bare dollar number. Without it, pct is null and the daemon
# only surfaces the remaining dollars (balance_usd) — a prepaid balance has no
# intrinsic ceiling to take a percentage of.
# balance_cap = 200

[providers.groq]
enabled = false
interval_seconds = 900
# Groq has NO public spend/usage API (checked 2026-07 — only a feature
# request open upstream). This plugin reads the documented x-ratelimit-*
# response headers off a real chat completion call instead — there is no
# free "status only" endpoint, so every poll burns a real request/token tick
# against your daily (RPD) and per-minute (TPM) limits. interval_seconds is
# longer than the 300s default for this reason; lower it at your own cost.
# API key from console.groq.com/keys. Daemon never writes this file.
api_key_file = "~/.config/usage-daemon/groq.key"
# ...or inline:
# api_key = "gsk_..."
# Optional: override the probe model (default openai/gpt-oss-20b — pick the
# cheapest/fastest model your key actually has access to, to minimize the
# cost of polling; check with `GET /openai/v1/models` if unsure, since not
# every model in Groq's public rate-limit docs is served to every key).
# model = "openai/gpt-oss-20b"

[providers.firecrawl]
enabled = false
interval_seconds = 300
# Firecrawl bills monthly credits against a plan cap. Reads
# GET api.firecrawl.dev/v2/team/credit-usage (remainingCredits / planCredits +
# billing period) and renders a used-% window that resets at billingPeriodEnd.
# API key (Bearer) from firecrawl.dev/app/api-keys. Daemon never writes this file.
api_key_file = "~/.config/usage-daemon/firecrawl.key"
# ...or inline:
# api_key = "fc-..."
# Optional: override the API base (self-hosted Firecrawl). Default api.firecrawl.dev.
# api_url = "https://api.firecrawl.dev"

[providers.tavily]
enabled = false
interval_seconds = 300
# Tavily bills monthly search credits against a plan cap. Reads
# GET app.tavily.com/api/account (usage vs limit + plan metadata) and renders a
# used-% window that resets at last_reset.
# Auth is a browser SESSION COOKIE for app.tavily.com — same model as ollama.
# Copy from DevTools -> Application -> Cookies -> app.tavily.com (the whole
# "name=value; name2=value2" cookie header), into this file:
cookie_file = "~/.config/usage-daemon/tavily.cookie"
# ...or inline:
# cookie = "session=...; auth=..."
# Or pull from Firefox automatically (like ollama/mistral):
# cookie_from_firefox = "app.tavily.com"

[providers.serpapi]
enabled = false
interval_seconds = 300
# SerpApi monthly plan meter from the free Account API
# (GET serpapi.com/account.json) — searches_per_month cap vs this_month_usage,
# resetting at plan_renewal_date. The Account API call never counts toward the
# monthly quota, so polling is free. API key from serpapi.com/manage-api-key.
# Auth is the `api_key` query param (not a Bearer header). Daemon never writes
# this file.
api_key_file = "~/.config/usage-daemon/serpapi.key"
# ...or inline:
# api_key = "..."
# Optional: override the API base. Default serpapi.com.
# api_url = "https://serpapi.com"

[providers.llm7]
enabled = false
interval_seconds = 300
# LLM7 token quota: Bearer JWT from the dashboard SPA session.
# Paste the JWT via the web UI Settings gear; the daemon writes it here so it
# survives restarts. Reports auth_expired until then. Get the token from
# DevTools -> Network -> any request to api-token.llm7.io -> Authorization header.
# Daemon never writes this file.
api_token_file = "~/.config/usage-daemon/llm7.token"
# ...or inline:
# api_token = "eyJ..."

[providers.hyper]
enabled = false
interval_seconds = 300
# Charm Hyper credits: GET /v1/credits with Bearer API key.
# Create an API key at hyper.charm.land/teams/<id>/api-keys. Paste the key
# via the web UI Settings gear; the daemon writes it here so it survives restarts.
# api_token_file = "~/.config/usage-daemon/hyper.token"
# ...or inline:
# api_token = "sk-hyper-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

[providers.abacus]
enabled = false
interval_seconds = 300
# Abacus.AI ChatLLM compute point usage: POST to apps.abacus.ai/api/v1/_getCompleteUserInfo.
# Auth is the browser session cookie. Paste the cookie via the web UI Settings gear;
# the daemon persists it here so it survives restarts. Reports auth_expired until then.
# cookie_file = "~/.config/usage-daemon/abacus.cookie"
# ...or inline (the full Cookie header value):
# cookie = "session=abc123..."

# Optional HTTP control surface (restart/stop the daemon from the web UI).
# OFF by default — the daemon has no per-request auth, so ANY browser on the LAN
# can stop the daemon when this is on. Only enable it on a LAN/Tailscale-trusted
# host, and prefer running under the systemd unit (Restart=always) so a stop is
# recoverable. restart spawns a detached replacement of the process and exits;
# stop just exits (under systemd, the unit restarts it ~5s later).
[providers.context7]
enabled = false
interval_seconds = 300
# Context7 monthly request quota from the dashboard stats endpoint
# (GET context7.com/api/dashboard/stats/<team_id>) — quotaLimit cap vs
# userRequests consumed this cycle. No reset date is in the payload.
# team_id is the UUID in the dashboard URL/API path, not a secret:
team_id = "00000000-0000-0000-0000-000000000000"
# Auth is a browser SESSION COOKIE for context7.com (Clerk). The __session
# JWT is short-lived (~60s) — a hand-pasted cookie goes stale almost
# immediately, so pull it fresh from Firefox before every poll instead:
cookie_from_firefox = "context7.com"
# ...or paste manually (will go stale fast, not recommended):
# cookie_file = "~/.config/usage-daemon/context7.cookie"
# cookie = "__session=...; __client_uat=..."

[providers.consensus]
enabled = false
interval_seconds = 300
# Consensus monthly query counters from the Clerk session object itself
# (GET clerk.consensus.app/v1/client) — pro/deep/snapshot query counts live
# in public_metadata as arrays (used count = array length). Free-tier caps
# (15/3/10) are hardcoded plan constants read off the UI, not from the API —
# see the comment in src/providers/consensus.js if this account isn't free.
cookie_from_firefox = "consensus.app"
# ...or paste manually (will go stale fast, not recommended):
# cookie_file = "~/.config/usage-daemon/consensus.cookie"
# cookie = "__client=...; __client_uat=..."

[providers.cohere]
enabled = false
interval_seconds = 900
# Cohere token usage (informational, no cap) from the dashboard's internal RPC
# (POST production.api.os.cohere.com/rpc/BlobheartAPI/GetAPIUsage). NOT the
# regular Cohere API key — this needs the dashboard SESSION JWT (Authorization:
# Bearer header on dashboard.cohere.com network calls), which expires in ~5
# days and must be re-pasted manually (it lives in browser storage, not a
# cookie, so cookie_from_firefox can't recover it). org_id is not secret —
# it's the orgID visible in the same dashboard network calls.
org_id = "00000000-0000-0000-0000-000000000000"
api_token_file = "~/.config/usage-daemon/cohere.token"
# ...or inline:
# api_token = "eyJhbGciOi..."

[providers.elevenlabs]
enabled = false
interval_seconds = 300
# ElevenLabs character quota from GET api.elevenlabs.io/v1/user/subscription
# (free call). API key from elevenlabs.io/app/settings/api-keys.
api_key_file = "~/.config/usage-daemon/elevenlabs.key"
# ...or inline:
# api_key = "sk_..."

[providers.runpod]
enabled = false
interval_seconds = 300
# RunPod pay-as-you-go balance from the GraphQL API (no REST equivalent):
# POST api.runpod.io/graphql?api_key=... { myself { clientBalance } }
# API key from runpod.io/console/user/settings.
api_key_file = "~/.config/usage-daemon/runpod.key"
# ...or inline:
# api_key = "rpa_..."

[providers.github]
enabled = false
interval_seconds = 300
# GitHub REST/search/graphql API rate-limit status (free, GET api.github.com/
# rate_limit) — call budget, NOT Copilot/Actions usage (that needs separate
# billing endpoints, not yet built — see src/providers/github.js comment).
# Fine-grained PAT from github.com/settings/tokens (no special scopes needed
# for rate_limit; add `Plan: read` if the billing endpoints get added later).
api_key_file = "~/.config/usage-daemon/github.token"
# ...or inline:
# api_key = "github_pat_..."

[control]
allow_control = false
# log_file = "~/.local/state/usage-daemon/daemon.log"  # a respawned process' stdio (default: the logging.file below)

# Logging. Defaults shown. The daemon logs to this file AND to stderr (which is
# journald when it runs under systemd). Lines are timestamped and the file
# self-rotates by size — never redirect a shell `>` into the same file, that is
# what used to truncate away every previous run's crash evidence.
[logging]
# file = "~/.local/state/usage-daemon/daemon.log"  # NOT /tmp — a reboot wipes /tmp
# level = "info"        # debug | info | warn | error
# stderr = true         # false to log only to the file
# max_bytes = 5242880   # rotate at 5 MiB
# keep = 3              # daemon.log.1 .. daemon.log.3
